plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

jar { archiveClassifier = 'dev' }
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}
assemble.dependsOn shadowJar
